name: Docs Site

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/**"
      - "course/**"
      - "scripts/check_docs_site.sh"
      - "scripts/capture_showcase_examples.sh"
      - "scripts/capture_gallery.py"
      - "scripts/showcase-gallery.json"
      - "examples/**"
      - "scripts/sync_docs_site_assets.sh"
      - "package.json"
      - "bun.lock"
      - "wrangler.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "course/**"
      - "scripts/check_docs_site.sh"
      - "scripts/capture_showcase_examples.sh"
      - "scripts/capture_gallery.py"
      - "scripts/showcase-gallery.json"
      - "examples/**"
      - "scripts/sync_docs_site_assets.sh"
      - "package.json"
      - "bun.lock"
      - "wrangler.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified website to production
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - run: sh scripts/check_docs_site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lcom-ng-website
          path: docs-site/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error

  deploy_pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: lcom-ng-website
          path: docs-site/.vitepress/dist

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy docs-site/.vitepress/dist --project-name="$PAGES_PROJECT" --branch=main
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'machine-lab-docs' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
