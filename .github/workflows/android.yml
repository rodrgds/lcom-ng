name: Native Android exports

on:
  # Android CI is paused while development focuses on the web app.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build and verify native APKs and relocated source projects
        run: |
          devenv shell -- lcom-ng-build
          devenv shell -- python3 tests/android_export.py --build-apk --abi arm64-v8a --abi x86_64
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: devenv shell -- python3 tests/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-checks
          path: |
            build/android-qa/smoke/game.apk
            build/android-qa/direct/game.apk
            build/android-qa/coordinates/game.apk
            build/android-qa/*.png
            build/android-qa/android-logcat.txt
            build/android-qa/android-direct-*.txt
            build/android-qa/android-coordinates-logcat.txt
