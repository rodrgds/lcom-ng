name: Browser exports

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install Devenv
        run: nix profile add nixpkgs#devenv
      - name: Install JavaScript and browser dependencies
        run: |
          devenv shell -- bun install --frozen-lockfile
          devenv shell -- bunx playwright install --with-deps chromium
      - name: Verify browser exports
        run: devenv shell -- lcom-ng-web-test
      - name: Verify Arcade image packaging
        run: devenv shell -- python3 tests/arcade_packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            build/web-test-results
            build/web-qa
