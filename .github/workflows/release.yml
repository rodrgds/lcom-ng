name: Build student releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, leave empty to test the selected branch
        required: false
        type: string
      publish:
        description: Create a draft GitHub Release for the existing tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: student-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['REQUESTED_TAG'] or os.environ['PUSH_TAG']
          if os.environ['PUBLISH'] == 'true' and not tag:
              raise SystemExit('Publishing requires an existing version tag')
          if tag:
              version = json.loads(Path('package.json').read_text())['version']
              identifier = r'(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
              semantic = r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
              semantic += r'(?:-' + identifier + r'(?:\.' + identifier + r')*)?'
              semantic += r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
              if not re.fullmatch(semantic, tag):
                  raise SystemExit('Use a semantic version tag, such as v0.2.0')
              if tag != 'v' + version:
                  raise SystemExit(f'Tag {tag} differs from package.json version {version}')
              # A branch named v0.2.0 is not a release tag. Fetch and compare the
              # exact remote tag, including peeling an annotated tag to its commit.
              reference = 'refs/tags/' + tag
              subprocess.check_call(['git', 'fetch', '--no-tags', 'origin', reference + ':' + reference])
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              tagged = subprocess.check_output(['git', 'rev-parse', reference + '^{commit}'], text=True).strip()
              if head != tagged:
                  raise SystemExit('The checked-out commit differs from the requested release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          PY

  build:
    needs: validate
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: lcom-ng-linux-x86_64
            shell: bash
          - os: ubuntu-24.04-arm
            asset: lcom-ng-linux-arm64
            shell: bash
          - os: macos-15-intel
            asset: lcom-ng-macos-x86_64
            shell: bash
          - os: macos-14
            asset: lcom-ng-macos-arm64
            shell: bash
          - os: windows-2025
            asset: lcom-ng-windows-msys2-x86_64
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config patchelf \
            curl tar gzip ffmpeg python3 libfreetype6-dev fonts-dejavu-core \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
          scripts/build_release_sdl.sh "$RUNNER_TEMP/lcom-sdl" "$RUNNER_TEMP/sdl-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/lcom-sdl/lib/pkgconfig:$RUNNER_TEMP/lcom-sdl/lib64/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/lcom-sdl/lib:$RUNNER_TEMP/lcom-sdl/lib64" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja ffmpeg python pkgconf sdl3 sdl3_ttf

      - name: Set up Windows POSIX build environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel gcc clang git python cmake ninja pkgconf tar gzip
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-ttf
            mingw-w64-x86_64-ttf-dejavu

      - name: Check out Windows sources with the POSIX toolchain
        if: runner.os == 'Windows'
        env:
          CHECKOUT_REF: ${{ inputs.tag || github.sha }}
          CHECKOUT_REPOSITORY: https://github.com/${{ github.repository }}.git
        run: |
          # Native Git rejects original DOS device/colon filenames. Use the
          # same POSIX Git/Python/filesystem boundary as the MSYS SDK tests.
          export PATH="/usr/bin:$PATH"
          /usr/bin/git init .
          git config core.autocrlf false
          git config core.ignorecase false
          git remote add origin "$CHECKOUT_REPOSITORY"
          git fetch --depth=1 --no-tags origin "$CHECKOUT_REF"
          python3 - <<'PY'
          import collections, subprocess
          from pathlib import Path, PurePosixPath
          records = subprocess.check_output(['git','ls-tree','-rz','FETCH_HEAD']).split(b'\0')
          groups = collections.defaultdict(set)
          for record in filter(None, records):
              path = record.split(b'\t',1)[1].decode()
              for prefix in PurePosixPath(path).parents:
                  if str(prefix) != '.':
                      groups[str(prefix).casefold()].add(str(prefix))
              groups[path.casefold()].add(path)
          parents = {str(PurePosixPath(path).parent)
                     for names in groups.values() if len(names) > 1 for path in names}
          for directory in sorted(parents, key=lambda p: (len(PurePosixPath(p).parts), p)):
              Path(directory).mkdir(parents=True, exist_ok=True)
              windows = subprocess.check_output(['cygpath','-w',directory],text=True).strip()
              subprocess.run(['fsutil.exe','file','setCaseSensitiveInfo',windows,'enable'],check=True)
          PY
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import collections, hashlib, re, subprocess
          from pathlib import Path
          entries = {}
          groups = collections.defaultdict(list)
          for record in filter(None, subprocess.check_output(['git','ls-files','-sz']).split(b'\0')):
              metadata, name = record.split(b'\t',1)
              path = name.decode()
              entries[path] = metadata.split()[1].decode()
              groups[path.casefold()].append(path)
          selected = {path for names in groups.values() if len(names) > 1 for path in names}
          for path in entries:
              for part in path.split('/'):
                  if (re.fullmatch(r'(?i)(con|prn|aux|nul|com[1-9¹²³]|lpt[1-9¹²³])(?:\..*)?',part.rstrip(' .'))
                          or re.search(r'[<>:"\\|?*\x00-\x1f]',part) or part.endswith((' ','.'))):
                      selected.add(path)
          for path in sorted(selected):
              source = Path(path)
              assert source.name in [item.name for item in source.parent.iterdir()], path
              data = source.read_bytes()
              digest = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest == entries[path], (path, digest, entries[path])
              print('Verified POSIX checkout:', path)
          print('Verified', len(selected), 'reserved, special and case-distinct original files')
          PY

      - name: Configure Windows SDL C libraries and FFmpeg
        if: runner.os == 'Windows'
        run: |
          # Keep the POSIX gcc ABI for fork and UNIX sockets. SDL exposes C DLL
          # entry points; no FILE*, allocators or C++ objects cross that boundary.
          prefix="$(cygpath -u "$RUNNER_TEMP")/lcom-sdl"
          mkdir -p "$prefix/include" "$prefix/lib/pkgconfig"
          cp -R /mingw64/include/SDL3 /mingw64/include/SDL3_ttf "$prefix/include/"
          cp /mingw64/lib/libSDL3.dll.a /mingw64/lib/libSDL3_ttf.dll.a "$prefix/lib/"
          # Do not put the entire mingw include directory before MSYS libc.
          for library in sdl3 sdl3-ttf; do
            # Only the public SDL C headers and shared DLL imports cross ABIs.
            # FreeType/HarfBuzz remain private dependencies of the mingw DLL.
            sed -e "s|^includedir=.*|includedir=$prefix/include|" \
              -e '/^Requires.private:/d' -e '/^Libs.private:/d' \
              "/mingw64/lib/pkgconfig/$library.pc" > "$prefix/lib/pkgconfig/$library.pc"
          done
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          for program in ffmpeg ffprobe; do
            cat > "/usr/bin/$program" <<EOF
          #!/usr/bin/env sh
          PATH="/mingw64/bin:\$PATH" exec /mingw64/bin/$program.exe "\$@"
          EOF
            chmod +x "/usr/bin/$program"
          done

      - name: Verify media test tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Configure desktop runtime
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/usr/bin:/mingw64/bin:$PATH"
            # MSYS /etc/profile resets this variable at every shell startup.
            export PKG_CONFIG_PATH="$(cygpath -u "$RUNNER_TEMP")/lcom-sdl/lib/pkgconfig"
            pkg-config --modversion --cflags --libs sdl3 sdl3-ttf
          fi
          cmake -S . -B build -G Ninja -DMACHINE_LAB_WITH_SDL=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="/usr/bin:/mingw64/bin:$PATH"; fi
          cmake --build build --parallel 4
      - name: Test runtime and labs
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="/usr/bin:/mingw64/bin:$PATH"; fi
          ctest --test-dir build --output-on-failure

      - name: Package Linux student archive
        if: runner.os == 'Linux'
        run: python3 scripts/package_desktop.py --build build --output dist
      - name: Package macOS student archive
        if: runner.os == 'macOS'
        run: python3 scripts/package_macos.py --build build --output dist
      - name: Package Windows MSYS2 student archive
        if: runner.os == 'Windows'
        run: |
          export PATH="/usr/bin:/mingw64/bin:$PATH"
          python3 scripts/package_desktop.py --build build --output dist --windows-msys2

      - name: Smoke relocated macOS SDK with Apple host tools
        if: runner.os == 'macOS'
        run: /usr/bin/python3 tests/macos_bundle_smoke.py "dist/${{ matrix.asset }}.tar.gz"
      - name: Smoke relocated Linux or Windows desktop SDK
        if: runner.os != 'macOS'
        run: python3 tests/student_bundle_smoke.py "dist/${{ matrix.asset }}.tar.gz" --desktop

      - name: Upload verified archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

      - name: Preserve failed package for diagnosis
        if: failure() && hashFiles('dist/*.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unverified-${{ matrix.asset }}
          path: dist/
          retention-days: 3

  release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums and prepare release notes
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat > release-notes.md <<'EOF'
          Download the archive for your machine and keep its directory intact. Each archive includes the desktop runtime, native SDK, Minix compatibility SDK and labs.

          Start here: https://lcom.rgo.pt/students/install

          Linux archives target Ubuntu 24.04 or newer compatible desktops. Windows uses the MSYS2 MSYS terminal. A host C compiler, make and Python are needed to compile student projects. SDL is included.

          These macOS archives are ad-hoc signed, not notarized. Intel and ARM archives are separate. See the installation guide for first-launch instructions.
          EOF
      - name: Create or refresh a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases are immutable; use a new version tag"'
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
              --draft --verify-tag --title "lcom-ng $TAG" \
              --notes-file dist/release-notes.md --generate-notes
          fi
