<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a09">
<title>@NAME@</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="launcher.css">
<script type="module" src="launcher.js"></script>
</head>
<body>
<main id="library">
  <header class="masthead">
    <div class="identity"><h1>@NAME@</h1><p id="count" aria-live="polite">Loading games…</p></div>
    <div class="tools"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="search" type="search" placeholder="Find a game" aria-label="Find a game" autocomplete="off"></label><button id="fullscreen" class="icon-button" type="button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  </header>
  <div class="section-label"><h2>Pick your next game</h2><span>Made in LCOM</span></div>
  <div id="games" class="games" role="list"></div>
  <p id="empty" hidden>No games match. Try another name.</p>
  <p id="error" role="alert" hidden></p>
  <footer>Original student games. One place to play.</footer>
</main>
<section id="play" hidden aria-label="Game player">
  <button id="back" class="back" type="button" aria-label="Games" title="Back to games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></button>
  <div id="frame-host"></div>
</section>
</body>
</html>
