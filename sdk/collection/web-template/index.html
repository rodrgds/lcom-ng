<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101021">
<title>@NAME@</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/bricolage.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="launcher.css">
<script type="module" src="launcher.js"></script>
</head>
<body>
<main id="library">
  <div id="grid" class="mosaic">
    <div class="library-controls" role="group" aria-label="Library controls">
      <a class="identity grid-utility" href="./" aria-label="@NAME@ home"><img src="assets/arcade.svg" width="44" height="44" alt=""><h1>@NAME@</h1></a>
      <button id="search-toggle" class="utility-tile grid-utility" type="button" aria-label="Find a game" aria-haspopup="dialog" aria-expanded="false" aria-controls="search-panel" title="Find a game (Ctrl+K / ⌘K)" aria-keyshortcuts="Control+k Meta+k"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>Search</span></button>
      <button id="fullscreen" class="utility-tile grid-utility" type="button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Screen</span></button>
      <button id="shuffle" class="utility-tile grid-utility" type="button" aria-label="Shuffle games" title="Shuffle games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 3.5-2 5-5m2-3c1.5-2.5 3-4 5-4h3m-4-4 4 4-4 4"/></svg><span>Shuffle</span></button>
      <button id="surprise" class="utility-tile grid-utility" type="button" aria-label="Surprise me" aria-haspopup="dialog" aria-controls="surprise-panel" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="9" width="22" height="19" rx="4"/><path d="M11 9V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3M5 17h7m8 0h7m-14-3 3 6 3-6"/></svg><span>Surprise</span></button>
    </div>
    <div id="games" role="list" aria-label="Games"></div>
  </div>
  <p id="count" class="sr-only" aria-live="polite">Loading games…</p>
  <p id="error" role="alert" hidden></p>
</main>
<dialog id="search-panel" aria-label="Find a game">
  <form role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="search" type="search" placeholder="Search games…" aria-label="Find a game" autocomplete="off" autofocus></form>
  <p id="search-count" role="status"></p>
  <div id="search-results" role="list" aria-label="Search results"></div>
  <p id="empty" hidden>No games match. Try another name.</p>
</dialog>
<dialog id="surprise-panel" aria-labelledby="surprise-title">
  <div class="surprise-heading"><h2 id="surprise-title">Surprise me</h2><div class="surprise-tools"><button id="surprise-close" class="icon-button" type="button" aria-label="Close Surprise me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div>
  <div id="surprise-reel" aria-hidden="true"><div class="roulette-track"></div><div class="roulette-marker"></div></div>
  <p id="surprise-result" role="status" aria-live="polite">Finding your next game…</p>
  <div class="surprise-actions"><button id="surprise-skip" type="button">Skip animation</button><button id="surprise-play" type="button" hidden>Play<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7z"/></svg></button><button id="surprise-again" type="button" hidden>Spin again</button></div>
</dialog>
<section id="play" hidden aria-label="Game player">
  <button id="back" class="back" type="button" aria-label="Games" title="Back to games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></button>
  <div id="frame-host"></div>
  <div id="loading" hidden>
    <div class="load-art"><img id="load-preview" src="assets/arcade.svg" alt=""><img class="load-logo" src="assets/arcade.svg" width="64" height="64" alt=""></div>
    <div class="load-copy"><h2 id="load-title"></h2><p id="load-description"></p>
      <div id="load-progress"><progress aria-label="Game download"></progress><p id="load-status" role="status">Loading game…</p></div>
      <div id="load-error" hidden><p role="alert">The game couldn’t load. Check your connection and try again.</p><button id="retry" type="button">Try again</button><button id="cancel" type="button">Back to games</button></div>
    </div>
  </div>
</section>
</body>
</html>
